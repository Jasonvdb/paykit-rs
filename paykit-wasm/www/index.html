<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>paykit-wasm harness</title>
    <link rel="icon" href="data:," />
    <script type="module">
      // Each worker runs one engine. `harness.mjs` drives them through these functions, and
      // receives each engine event through `window.__engineEvent(name, event)`, a binding the
      // harness exposes before the page loads.
      const workers = new Map();
      let next = 0;

      window.openWorker = (name) => {
        const worker = new Worker(new URL("./worker.js", import.meta.url), { type: "module" });
        const pending = new Map();
        worker.onmessage = (message) => {
          const data = message.data;
          if (data.kind === "event") {
            window.__engineEvent?.(name, data.event);
            return;
          }
          const call = pending.get(data.id);
          pending.delete(data.id);
          if (data.ok) call?.resolve(data.value);
          else call?.reject(new Error(data.error));
        };
        worker.onerror = (event) => {
          for (const call of pending.values()) call.reject(new Error(`worker error: ${event.message}`));
          pending.clear();
        };
        workers.set(name, { worker, pending });
      };

      window.callWorker = (name, op, args) =>
        new Promise((resolve, reject) => {
          const entry = workers.get(name);
          if (!entry) return reject(new Error(`no worker ${name}`));
          const id = next++;
          entry.pending.set(id, { resolve, reject });
          entry.worker.postMessage({ id, op, args });
        });

      // Terminates the worker at once, as a crash would: no `stop`, calls in flight rejected.
      window.closeWorker = (name) => {
        const entry = workers.get(name);
        if (!entry) return;
        entry.worker.terminate();
        for (const call of entry.pending.values()) call.reject(new Error("worker terminated"));
        workers.delete(name);
      };
    </script>
  </head>
  <body>
    paykit-wasm harness
  </body>
</html>
